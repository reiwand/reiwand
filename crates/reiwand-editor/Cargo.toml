[package]
name = "reiwand-editor"
description = "Scene editor of Reiwand: JSON Pointer operations, history, starting points, inspector and package folders"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reiwand-core.workspace = true
reiwand-scene.workspace = true
reiwand-script.workspace = true
reiwand-depth = { workspace = true, features = ["infer"] }
reiwand-format = { workspace = true, features = ["sign"] }
reiwand-ktx2 = { workspace = true, features = ["encode"] }
reiwand-video.workspace = true
reiwand-render.workspace = true
reiwand-type.workspace = true
ab_glyph.workspace = true
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
fontdb.workspace = true
image.workspace = true
semver.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
reiwand-fill.workspace = true

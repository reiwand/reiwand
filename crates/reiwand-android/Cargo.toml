[package]
name = "reiwand-android"
description = "Android live wallpaper for Reiwand"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reiwand-audio.workspace = true
reiwand-core.workspace = true
reiwand-depth = { workspace = true, features = ["infer"] }
reiwand-format = { workspace = true, features = ["sign"] }
reiwand-library.workspace = true
reiwand-mix.workspace = true
reiwand-providers.workspace = true
reiwand-render.workspace = true
reiwand-scene.workspace = true
reiwand-script.workspace = true
reiwand-schedule.workspace = true
reiwand-palette.workspace = true
reiwand-qr = { workspace = true, features = ["read"] }
reiwand-sync.workspace = true
reiwand-upgrade.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock"] }
image.workspace = true
libc.workspace = true
log.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
zeroize.workspace = true
zip.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
rquickjs-sys = { workspace = true, features = ["bindgen"] }
wgpu.workspace = true
pollster.workspace = true
jni.workspace = true
ndk = { workspace = true, features = ["audio", "media", "nativewindow", "api-level-31"] }
ndk-sys = { workspace = true, features = ["bitmap"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
rquickjs.workspace = true
tokio-rustls.workspace = true

[package]
name = "reiwand-upgrade"
description = "One-time upgrade of stored Reiwand data (server, desktop, phone) to the layout the current programs expect"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "reiwand_upgrade"

[[bin]]
name = "reiwand-upgrade"
path = "src/main.rs"
required-features = ["server", "client"]

[features]
default = ["server", "client"]
server = ["dep:rusqlite"]
client = ["dep:zbus", "dep:tokio", "dep:serde", "dep:rusqlite"]

[dependencies]
anyhow.workspace = true
reiwand-account.workspace = true
reiwand-carry.workspace = true
reiwand-core.workspace = true
reiwand-format = { workspace = true, features = ["sign"] }
reiwand-sync.workspace = true
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
toml.workspace = true
toml_edit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

[dev-dependencies]
reiwand-core = { workspace = true, features = ["schema"] }
reiwand-carry = { workspace = true, features = ["schema"] }
reiwand-scene.workspace = true
schemars.workspace = true

[package]
name = "reiwand-audio"
description = "Audio capture and spectrum analysis for Reiwand scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reiwand-scene.workspace = true
realfft.workspace = true

[features]
capture = ["dep:pipewire", "dep:rtrb", "dep:tracing"]

[target.'cfg(not(target_os = "android"))'.dependencies]
pipewire = { workspace = true, optional = true }
rtrb = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

services:
  reiwand:
    image: ghcr.io/reiwand/reiwand-server:${REIWAND_VERSION:-latest}
    restart: unless-stopped
    environment:
      REIWAND_PUBLIC_URL: ${REIWAND_PUBLIC_URL:?falta REIWAND_PUBLIC_URL en .env}
      REIWAND_NAME: ${REIWAND_NAME:-reiwand}
      REIWAND_REGISTRATION: ${REIWAND_REGISTRATION:-invite}
      REIWAND_AUTO_PUBLISH: ${REIWAND_AUTO_PUBLISH:-trusted}
      REIWAND_LICENSES: ${REIWAND_LICENSES:-CC0-1.0,CC-BY-4.0,CC-BY-SA-4.0}
      REIWAND_PACKAGE_MAX_MIB: ${REIWAND_PACKAGE_MAX_MIB:-256}
      REIWAND_USER_QUOTA_MIB: ${REIWAND_USER_QUOTA_MIB:-2048}
      REIWAND_UPLOADS_PER_DAY: ${REIWAND_UPLOADS_PER_DAY:-20}
      REIWAND_SYNC_QUOTA_MIB: ${REIWAND_SYNC_QUOTA_MIB:-64}
      REIWAND_FILES_QUOTA_MIB: ${REIWAND_FILES_QUOTA_MIB:-1024}
      REIWAND_ENTRY_DAYS: ${REIWAND_ENTRY_DAYS:-7}
      REIWAND_RESIGN_HOURS: ${REIWAND_RESIGN_HOURS:-24}
      REIWAND_PUBLISH_DELAY_SECS: ${REIWAND_PUBLISH_DELAY_SECS:-30}
      REIWAND_LEGAL_OPERATOR: ${REIWAND_LEGAL_OPERATOR:-}
      REIWAND_LEGAL_CONTACT: ${REIWAND_LEGAL_CONTACT:-}
      REIWAND_LEGAL_JURISDICTION: ${REIWAND_LEGAL_JURISDICTION:-}
      REIWAND_LEGAL_DMCA_AGENT: ${REIWAND_LEGAL_DMCA_AGENT:-}
      REIWAND_LOG_CLIENTS: ${REIWAND_LOG_CLIENTS:-off}
      REIWAND_LOG_CLIENTS_DAYS: ${REIWAND_LOG_CLIENTS_DAYS:-7}
      REIWAND_NOTICE_DAYS: ${REIWAND_NOTICE_DAYS:-180}
      REIWAND_TAKEDOWN_DAYS: ${REIWAND_TAKEDOWN_DAYS:-90}
      REIWAND_RATE_LIMITS: ${REIWAND_RATE_LIMITS:-true}
      REIWAND_TLS: ${REIWAND_TLS:-off}
      REIWAND_ADVERTISE: ${REIWAND_ADVERTISE:-false}
      REIWAND_LOG: ${REIWAND_LOG:-info}
    ports:
      - "${REIWAND_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - ./data:/data

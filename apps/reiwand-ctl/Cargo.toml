[package]
name = "reiwand-ctl"
description = "Command line control for the Reiwand daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reiwand-core.workspace = true
reiwand-client.workspace = true
reiwand-format = { workspace = true, features = ["sign"] }
reiwand-providers.workspace = true
reiwand-qr.workspace = true
reiwand-sync.workspace = true
reiwand-render = { workspace = true, features = ["avif"] }
reiwand-depth = { workspace = true, features = ["fetch", "infer"] }
reiwand-scene.workspace = true
reiwand-editor.workspace = true
reiwand-ktx2.workspace = true
anyhow.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
futures-util.workspace = true
image.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
reiwand-video.workspace = true

[[test]]
name = "net"
path = "tests/net/main.rs"
harness = false
